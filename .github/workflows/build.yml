name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Find and unzip source
        run: |
          echo "ไฟล์ใน repo:"; ls -la
          if [ ! -f gradlew ] && [ ! -d mangathai-android ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1)
            if [ -z "$ZIP" ]; then
              echo "::error::ไม่พบไฟล์ .zip ใน repo กรุณาอัปโหลด MangaThai-Mobile-source.zip"
              exit 1
            fi
            echo "แตกไฟล์: $ZIP"
            unzip -o "$ZIP"
          fi

      - name: Build
        run: |
          DIR=$(dirname "$(find . -name gradlew -not -path './.git/*' | head -1)")
          echo "build ใน: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MangaThai.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MangaThai-APK
          path: MangaThai.apk
