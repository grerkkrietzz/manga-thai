name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Unzip source
        run: unzip -o MangaThai-Mobile-source.zip

      - name: Build
        working-directory: mangathai-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MangaThai-APK
          path: mangathai-android/app/build/outputs/apk/debug/app-debug.apk
